[project]
name = "viacqua-homeassistant"
version = "0.1.0"
description = "Unofficial Home Assistant integration for the Viacqua (Vicenza) water utility portal"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "beautifulsoup4>=4.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
